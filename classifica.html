<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classifica FIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta name="theme-color" content="#2c3e50">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.json">

  <script type="module" crossorigin src="/basket-app/assets/classifica--ZohTm8z.js"></script>
  <link rel="modulepreload" crossorigin href="/basket-app/assets/modulepreload-polyfill-NNg5saUz.js">
  <link rel="modulepreload" crossorigin href="/basket-app/assets/myTeamConfig-D_wV71PI.js">
  <link rel="stylesheet" crossorigin href="/basket-app/assets/classifica-D5IVKubs.css">
</head>
<body>

<div class="container">
    <!-- SEZIONE IN ALTO: FISSA -->
    <div class="header-container fixed-section">
        <div class="brand-section">
            <a href="index.html" class="home-btn" aria-label="Home">
                <i class="fas fa-home"></i>
            </a>
            <h2>Classifiche FIP</h2>
        </div>
        <div id="admin-actions" class="hidden admin-actions-wrapper">
            <button id="btn-refresh-fip" class="fip-btn admin-btn admin-btn-refresh">
                <i class="fas fa-sync-alt"></i> Refresh FIP
            </button>
            
            <button id="btn-sync-firebase" class="fip-btn admin-btn admin-btn-sync">
                <i class="fas fa-cloud-upload-alt"></i> Sync Firebase
            </button>
        </div>
    </div>

    <!-- Contenitore del filtro aggiornato con Label + Bottone dinamico/ciclico -->
    <div class="filter-container fixed-section campionato-filter-box">
        <span class="campionato-label">Campionato:</span>
        <div id="campionato-selector-wrapper">
            <!-- Il bottone ciclico o la stringa fissa verranno generati dinamicamente via JS -->
        </div>
    </div>

    <!-- I DUE BOTTONI POSIZIONATI IN ALTO (dopo i filtri e prima dei contenitori) -->
    <div class="action-buttons-row fixed-section">
        <button id="btn-calendario-completo" class="unified-bottom-btn" onclick="mostraCalendarioCompleto()">
            <i class="fas fa-calendar-alt"></i> Calendario
        </button>
        
        <a id="fip-external-link" href="#" target="_blank" class="unified-bottom-btn">
            Sito FIP <i class="fas fa-external-link-alt external-link-icon"></i>
        </a>
    </div>

    <!-- SUGGERIMENTO: FISSO -->
    <div id="hint-classifica" class="fixed-section hint-text">
        <i class="fas fa-info-circle hint-icon"></i> Clicca su una squadra per vedere le sue partite...
    </div>

    <!-- CONTENITORE TABELLA CLASSIFICA -->
    <div id="table-container" class="main-table-wrapper">
        <div class="loading">Sincronizzazione dati FIP...</div>
    </div>

    <!-- CONTENITORE DETTAGLI PARTITE -->
    <div id="details-container" class="hidden details-wrapper">
        <div class="header-details fixed-section">
            <button onclick="showClassifica()" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <h3 id="selected-team-name">Nome Squadra</h3>
        </div>
        <div id="team-matches-list" class="team-matches-scroll">
        </div>
    </div>

    <!-- Nota classifica provvisoria in basso -->
    <div id="nota-classifica" class="hidden fixed-section nota-provvisoria">
        * classifica provvisoria
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>   

</body>
</html>
