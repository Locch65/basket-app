<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> Modulo Atletica</title>
    

    <link rel="manifest" href="manifest.json">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script type="module" crossorigin src="/basket-app/assets/modulepreload-polyfill-5H5fyg99.js"></script>
  <script type="module" crossorigin src="/basket-app/assets/U14_FN-CZzT4iYp.js"></script>
  <script type="module" crossorigin src="/basket-app/assets/myTeamConfig-BiHASoUv.js"></script>
  <script type="module" crossorigin src="/basket-app/assets/main-C-LrgxL8.js"></script>
  <link rel="stylesheet" crossorigin href="/basket-app/assets/main-DbZ7AZpq.css">
  <link rel="stylesheet" crossorigin href="/basket-app/assets/tracking-Dr-weI22.css">
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="home-btn" aria-label="Home">
            <i class="fas fa-home"></i>
        </a>
        <h2> Modulo Atletica</h2>
    </div>

    <div class="main-container">
        <!-- Pannello Sinistro: Controlli e Tabella Statistiche -->
        <div class="left-panel">
            <!-- Barra Controlli -->
            <div class="controls-bar">
                <div class="control-item" style="flex: 1 1 100%;">
                    <span>Sorgente:</span>
                    <select id="sourceSelect" class="source-select" style="width: 100%;">
                        <option value="SIM" selected>🧪 Simulazione Locale (Demo)</option>
                        <option value="WS">⚡ WebSocket Locale (10 Hz)</option>
                        <option value="FIREBASE">🔥 Firebase Live (Batch 1s)</option>
                    </select>
                </div>

                <div class="control-item">
                    <span>Heatmap:</span>
                    <select id="heatmapSelect">
                        <option value="NONE">-- Off --</option>
                        <optgroup label="Squadra Casa">
                            <option value="P01">P1 - Playmaker</option>
                            <option value="P02">P2 - Guardia</option>
                            <option value="P03">P3 - Ala Piccola</option>
                            <option value="P04">P4 - Ala Grande</option>
                            <option value="P05">P5 - Centro</option>
                        </optgroup>
                        <optgroup label="Avversari">
                            <option value="OPP1">OPP1 - Playmaker Opp</option>
                            <option value="OPP2">OPP2 - Guardia Opp</option>
                            <option value="OPP3">OPP3 - Ala Piccola Opp</option>
                            <option value="OPP4">OPP4 - Ala Grande Opp</option>
                            <option value="OPP5">OPP5 - Centro Opp</option>
                        </optgroup>
                    </select>
                </div>

                <div class="control-item">
                    <span>Finestra:</span>
                    <select id="heatTimeSelect">
                        <option value="50">5 sec</option>
                        <option value="150" selected>15 sec</option>
                        <option value="300">30 sec</option>
                        <option value="600">1 min</option>
                    </select>
                </div>

                <div>
                    <button id="btnResetHeat" class="btn-action btn-reset">🧹 Reset Heatmap</button>
                </div>
                <label class="control-item">
                    <input type="checkbox" id="toggleRaw"> Grezzi
                </label>

                <label class="control-item">
                    <input type="checkbox" id="toggleCentroidHome" checked> Rete Tattica (Casa)
                </label>

                <label class="control-item">
                    <input type="checkbox" id="toggleCentroidOpp"> Rete Tattica (Avversari)
                </label>
            </div>

            <!-- Tabella Giocatori -->
            <div class="dashboard-section">
                <div class="dashboard-header">
                    <h3>📊 Live Performance</h3>
                    <button id="btnResetStats" class="btn-mini-reset">🔄 Reset Dati</button>
                </div>
                <div class="table-container">
<div class="tab-container">
    <button id="tabPositional" class="tab-btn active" onclick="switchStatsTab('POSITIONAL')">📍 Dati Posizionali</button>
    <button id="tabZones" class="tab-btn" onclick="switchStatsTab('SPEED_ZONES')">⚡ Speed Zones</button>
</div>

<table class="stats-table">
    <thead id="statsHeader"></thead>
    <tbody id="statsBody"></tbody>
</table>
                    
                </div>
            </div>
        </div>

        <!-- Sezione Campo Basket -->
        <div class="court-section">
            <div class="canvas-wrapper">
                <canvas id="court" width="840" height="450"></canvas>
            </div>
            <!-- Pulsante Pausa sempre visibile in basso -->
            <button id="btnPause" class="btn-pause">⏸️ Pausa</button>
        </div>
    </div>

</body>
</html>
