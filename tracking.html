<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modulo Atletica</title>
    

    <link rel="manifest" href="manifest.json">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/basket-app/assets/modulepreload-polyfill-D1F42cev.js"></script>
  <script type="module" crossorigin src="/basket-app/assets/U14_FN-DSGJeNsl.js"></script>
  <script type="module" crossorigin src="/basket-app/assets/myTeamConfig-B-dElTyN.js"></script>
  <script type="module" crossorigin src="/basket-app/assets/main-jkufFXpO.js"></script>
  <link rel="stylesheet" crossorigin href="/basket-app/assets/main-DbZ7AZpq.css">
  <link rel="stylesheet" crossorigin href="/basket-app/assets/tracking-DOcnm1Wi.css">
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="home-btn" aria-label="Home">
            <i class="fas fa-home"></i>
        </a>
        <h2>Modulo Atletica</h2>
        <button id="btnOpenSettings" class="settings-btn" aria-label="Impostazioni">
            <i class="fas fa-cog"></i>
        </button>
    </div>

    <div class="main-container">
        <!-- Pannello Sinistro: Controlli e Tabella Statistiche -->
        <div class="left-panel">
            <!-- Barra Controlli Principale -->
            <div class="controls-bar">
                
                <!-- BOX HEATMAP CON BORDO SOTTILE -->
                <div class="heatmap-box">
                    <span class="heatmap-label">Heatmap:</span>
                    <select id="heatTimeSelect">
                        <option value="50">5 sec</option>
                        <option value="150" selected>15 sec</option>
                        <option value="300">30 sec</option>
                        <option value="600">1 min</option>
                    </select>
                    <button id="btnResetHeat" class="btn-action btn-reset">🧹 Reset</button>
                </div>

                <label class="control-item">
                    <input type="checkbox" id="toggleCentroidHome" checked> Rete Tattica (Casa)
                </label>

                <label class="control-item">
                    <input type="checkbox" id="toggleCentroidOpp"> Rete Tattica (Avversari)
                </label>
            </div>

            <!-- Tabella Giocatori -->
            <div class="dashboard-section">
                <div class="table-container">
                    <div class="tab-container">
                        <button id="tabPositional" class="tab-btn active" onclick="switchStatsTab('POSITIONAL')">📍 Dati Posizionali</button>
                        <button id="tabZones" class="tab-btn" onclick="switchStatsTab('SPEED_ZONES')">⚡ Speed Zones</button>
                    </div>

                    <table class="stats-table">
                        <thead id="statsHeader"></thead>
                        <tbody id="statsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Sezione Campo Basket -->
        <div class="court-section">
            <div class="canvas-wrapper">
                <canvas id="court" width="840" height="450"></canvas>
            </div>
            <!-- Pulsante Pausa sempre visibile in basso -->
            <button id="btnPause" class="btn-pause">⏸ Pausa</button>
        </div>
    </div>

    <!-- POPUP IMPOSTAZIONI -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Impostazioni Tracking</h3>
            </div>
            <div class="modal-body">
                <div class="modal-item">
                    <label for="sourceSelect">Sorgente Dati:</label>
                    <select id="sourceSelect" class="source-select" style="width: 100%;">
                        <option value="SIM" selected>🧪 Simulazione Locale (Demo)</option>
                        <option value="WS">⚡ WebSocket Locale (10 Hz)</option>
                        <option value="FIREBASE">🔥 Firebase Live (Batch 1s)</option>
                    </select>
                </div>

                <!-- SEZIONE CONTROLLO DIMENSIONE FONT -->
                <div class="modal-item">
                    <label>Dimensione Testo:</label>
                    <div class="font-size-control">
                        <button id="btnFontSizeDec" class="btn-font" type="button" aria-label="Riduci testo">-</button>
                        <span id="fontSizeDisplay">62.5%</span>
                        <button id="btnFontSizeInc" class="btn-font" type="button" aria-label="Aumenta testo">+</button>
                    </div>
                </div>

                <!-- CHECKBOX MOSTRA AVVERSARI -->
                <div class="modal-item checkbox-item">
                    <label>
                        <input type="checkbox" id="toggleOpponents" checked> Mostra avversari
                    </label>
                </div>

                <div class="modal-item checkbox-item">
                    <label>
                        <input type="checkbox" id="toggleRaw"> Mostra dati sensori
                    </label>
                </div>

                <div class="modal-item">
                    <button id="btnResetStats" class="btn-mini-reset" style="width: 100%; padding: 0.8rem;">🔄 Reset Dati</button>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btnCloseSettings" class="btn-modal-close">Chiudi</button>
            </div>
        </div>
    </div>

</body>
</html>
