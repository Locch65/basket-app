<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>Calendario Partite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <meta name="theme-color" content="#2c3e50">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


  <script type="module" crossorigin src="/basket-app/assets/modulepreload-polyfill-eE5KzrAt.js"></script>
  <script type="module" crossorigin src="/basket-app/assets/U14_FN-DblSpPV7.js"></script>
  <script type="module" crossorigin src="/basket-app/assets/myTeamConfig-DroBi23H.js"></script>
  <script type="module" crossorigin src="/basket-app/assets/main-BGz28oPU.js"></script>
  <link rel="stylesheet" crossorigin href="/basket-app/assets/main-DbZ7AZpq.css">
  <link rel="stylesheet" crossorigin href="/basket-app/assets/calendario-XZvYMgxF.css">
</head>

<body>
  <header class="header-fissa">
    <a href="index.html" class="home-btn" aria-label="Home">
      <i class="fas fa-home"></i>
    </a>

    <div class="header-toolbar">
        <button id="btnCicloCamp" class="btn-tool">
          <i class="fas fa-trophy"></i> <span id="labelCamp">Tutti</span>
        </button>

        <button id="btnCicloStato" class="btn-tool">
          <i class="fas fa-filter"></i> <span id="labelStato">Tutte</span>
        </button>

        <button id="btnToggleOrdine" class="btn-tool">
          <i class="fas fa-sort"></i>
        </button>

        <button id="btnSearchToggle" class="btn-tool">
          <i class="fas fa-search"></i>
        </button>

        <span id="matchCounter" class="match-counter btn-admin-counter" role="button" style="cursor: pointer;">
          <i class="fas fa-sync-alt"></i> 12/24
        </span>

    </div>
  </header>
  <div id="searchContainer" class="search-bar-container hidden">
    <div class="search-input-wrapper">
        <input type="text" id="inputSearch" placeholder="Cerca Squadra, match Id o Luogo..." autocomplete="off">
        <button id="btnClearSearch" class="search-action-btn">
            <i class="fas fa-times"></i>
        </button>
        <button id="btnSubmitSearch" class="search-action-btn">
            <i class="fas fa-arrow-right"></i>
        </button>
    </div>
  </div>

  <div id="listaPartite" class="loading"> </div>
  
  <!-- Contenitore Google Calendar -->
  <div id="calendarViewContainer" class="hidden">
    <!-- Overlay della barra di controllo posizionata sopra l'iframe -->
    <div class="calendar-controls-overlay">
      <button type="button" id="btnToday" class="btn-ctrl btn-today" title="Oggi">
        <i class="fas fa-calendar-day"></i> 
      </button>
      <button type="button" class="btn-ctrl btn-view active" data-mode="WEEK">W</button>
      <button type="button" class="btn-ctrl btn-view" data-mode="MONTH">M</button>
      <button type="button" class="btn-ctrl btn-view" data-mode="AGENDA">A</button>
    </div>

    <iframe 
      id="googleCalendarIframe" 
      src="" 
      style="border: 0" 
      width="100%" 
      height="100%" 
      frameborder="0" 
      scrolling="no"
      sandbox="allow-scripts allow-same-origin allow-forms">
    </iframe>
  </div>

  <div id="loadingPopup" class="loading-popup hidden">
    <div class="loading-content">
      <i class="fas fa-spinner fa-spin"></i>
      <span>Caricamento Calendario<br>(sync database)...</span>
    </div>
  </div>

  <!-- Bottone fisso in fondo allo schermo -->
  <button id="btnToggleCalendarView" class="btn-bottom-fixed">
    <i class="far fa-calendar-alt"></i> Mostra Google Calendar
  </button>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>   
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
